name: Rust indexer release
on:
  push:
    tags: ['chainkit-indexer-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu zstd
      - name: Verify version and run tests
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#chainkit-indexer-v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="chainkit-indexer-cli"))')" = "$version"
          cargo test --locked --workspace
      - run: bash packaging/build-release.sh --target '${{ matrix.target }}'
      - name: Package binary and installable artifacts
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#chainkit-indexer-v}
          binary=target/${{ matrix.target }}/release/chainkit-indexer
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          bash packaging/build-packages.sh "$binary" "$version" dist '${{ matrix.arch }}'
          mkdir -p bundle
          cp "$binary" bundle/
          cp examples/rust-indexer/config.example.toml packaging/README.md bundle/
          tar -C bundle -czf "dist/chainkit-indexer-${version}-${{ matrix.target }}.tar.gz" .
          dpkg-deb --info dist/*.deb
          tar --zstd -tf dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Source archive and checksums
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#chainkit-indexer-v}
          git archive --prefix="chainkit-indexer-${version}/" HEAD | gzip -n > "dist/chainkit-indexer-${version}-source.tar.gz"
          (cd dist && sha256sum *.deb *.pkg.tar.zst *.tar.gz > SHA256SUMS)
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Chainkit indexer ${GITHUB_REF_NAME#chainkit-indexer-v}"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
