[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainkit-indexer"
version = "0.1.0"
description = "Project-scoped contract indexing and transaction evidence queries"
requires-python = ">=3.11"
dependencies = ["chainkit-chain==0.1.0"]

[project.scripts]
chainkit-indexer = "chainkit_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chainkit_indexer = ["schema.sql"]
